<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Finder</title>

  <!-- Google Fonts: a warm serif for headings, a clean sans-serif for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== FEATURE 1: Header + Search bar ========== -->
  <header class="header">
    <h1 class="title">🍲 Recipe Finder</h1>
    <p class="tagline">Search by recipe name or ingredient and discover something delicious.</p>

    <!-- Using a <form> lets both the button and the Enter key trigger a search -->
    <form id="search-form" class="search-form">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="e.g. pasta, chicken, salmon..."
        aria-label="Search recipes"
        autocomplete="off"
      />
      <button type="submit" class="search-btn">Search</button>
    </form>

    <!-- ========== FEATURE 6: Category filter buttons ========== -->
    <!-- data-category must match TheMealDB's category name exactly -->
    <!-- FEATURE 10: the wrapper holds the scroll arrows + right-edge fade (shown only when the row can scroll) -->
    <div id="categories-wrap" class="categories-wrap">
    <button type="button" class="cat-arrow cat-arrow-left" aria-label="Scroll categories left">‹</button>
    <div id="categories" class="categories">
      <!-- FEATURE 12: local Pakistani recipes (no data-category, so it never uses the API) -->
      <button type="button" class="category-btn pakistani-btn" data-local="pakistani">🍛 Pakistani Food</button>
      <button type="button" class="category-btn" data-category="Chicken">🍗 Chicken</button>
      <button type="button" class="category-btn" data-category="Beef">🥩 Beef</button>
      <button type="button" class="category-btn" data-category="Seafood">🦐 Seafood</button>
      <button type="button" class="category-btn" data-category="Pasta">🍝 Pasta</button>
      <button type="button" class="category-btn" data-category="Vegetarian">🥦 Vegetarian</button>
      <button type="button" class="category-btn" data-category="Vegan">🌱 Vegan</button>
      <button type="button" class="category-btn" data-category="Breakfast">🍳 Breakfast</button>
      <button type="button" class="category-btn" data-category="Dessert">🍰 Dessert</button>
    </div>
    <button type="button" class="cat-arrow cat-arrow-right" aria-label="Scroll categories right">›</button>
    </div> <!-- end .categories-wrap -->

    <!-- Country dropdown + Favorites button share one row (see .filter-row in style.css) -->
    <div class="filter-row">

    <!-- ========== FEATURE 7: Area (country) filter ========== -->
    <!-- The options are filled in by script.js from the TheMealDB area list -->
    <div class="area-filter">
      <select id="area-select" class="area-select" aria-label="Filter recipes by country">
        <option value="">Loading countries...</option>
      </select>
    </div>

    <!-- ========== FEATURE 8: Favorites button ========== -->
    <!-- The count is updated by script.js -->
    <div class="favorites-bar">
      <button type="button" id="favorites-btn" class="favorites-btn">
        ♥ Favorites (<span id="favorites-count">0</span>)
      </button>
    </div>

    </div> <!-- end .filter-row -->
  </header>

  <main class="container">
    <!-- ========== FEATURE 3: Status messages (loading / empty / error) ========== -->
    <p id="status" class="status"></p>

    <!-- ========== FEATURE 2: Recipe cards are inserted here by script.js ========== -->
    <section id="results" class="results"></section>
  </main>

  <!-- ========== FEATURE 4: Recipe details popup (hidden by default) ========== -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <!-- Recipe details are inserted here by script.js -->
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
